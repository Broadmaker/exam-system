name = "exam-system"
main = "worker/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
assets = { directory = "dist", binding = "ASSETS", not_found_handling = "single-page-application" }

[vars]
# Public vars — set secrets via `wrangler secret put <NAME>` (never commit private keys).
# Required secrets: ADMIN_PASSWORD, VAPID_PRIVATE_KEY (VAPID_PRIVATE_KEY must be secret)
# Example: wrangler secret put VAPID_PRIVATE_KEY / wrangler secret put ADMIN_PASSWORD
# NOTE: VITE_ADMIN_PASSWORD var removed — default leaked auth. Use `wrangler secret put ADMIN_PASSWORD` only.
VAPID_PUBLIC_KEY = "BBFq3Yg0rjPgCRXaB_L6Gl2vD8-iwvCh3zekOG26RWZBZRVdw1KfK7Pu1rv77lb7p5dxCLC01Ek5FqeVjOf6jqE"
# VAPID_PRIVATE_KEY must be set as a secret, NOT here — `wrangler secret put VAPID_PRIVATE_KEY`
VAPID_SUBJECT = "mailto:admin@wmsu.edu.ph"
# AI Assist: Workers AI free tier (10k neurons/day). No secret needed.
AI_PARTIAL_THRESHOLD = "0.85"
AI_PARTIAL_CREDIT = "0.5"

[ai]
binding = "AI"

[observability]
enabled = true

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "exam-db"
database_id = "8d3aeb60-107e-41df-a235-ae63391afe94" # Set this after creating the D1 database
